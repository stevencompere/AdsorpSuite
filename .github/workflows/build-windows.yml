# Builds the Windows executable at every published release (and on demand):
# internal self-test, comparison with pyIAST, PyInstaller build, self-test of
# the executable. The .exe is attached to the release unless one is already there.
name: Build Windows executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib openpyxl pillow CoolProp pyinstaller

      - name: Internal self-test
        run: python AdsorpSuite.py --selftest --lang=en

      - name: Compare IAST with pyIAST
        continue-on-error: true
        run: |
          pip install pyiast six
          python validation/validate_iast_vs_pyiast.py AdsorpSuite.py

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name AdsorpSuite
          --icon adsorpsuite.ico --add-data "adsorpsuite.ico;." --add-data "adsorpsuite.png;."
          --collect-all CoolProp AdsorpSuite.py

      - name: Self-test of the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AdsorpSuite.exe -ArgumentList "--selftest","--lang=en","--out=selftest_exe.txt" -Wait -PassThru
          Get-Content selftest_exe.txt -Tail 3
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Name the executable
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "dev" }
          $name = "AdsorpSuite_${tag}_Windows.exe"
          Copy-Item dist\AdsorpSuite.exe "dist\$name"
          "EXE=dist/$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: AdsorpSuite-windows
          path: |
            ${{ env.EXE }}
            validation/results/

      - name: Attach to the release (unless an .exe is already attached)
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $names = gh release view $tag --json assets --jq '.assets[].name'
          if ($names -match '\.exe$') { "An executable is already attached to $tag." }
          else { gh release upload $tag $env:EXE }
